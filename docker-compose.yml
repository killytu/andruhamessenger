version: '3.9'

services:

  # ── Relay Server (Go) ────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hm-relay
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Web Client (React → nginx) ───────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hm-client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

networks:
  default:
    name: hybrid-messenger
